[package]
name = "sorofy-registry"
description = "Sorofy verifier registry: stake, attest, conservative consensus, slash (testnet prototype)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
